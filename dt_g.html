<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지리 탐정단 · 사라진 입장정리문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{
  --bg:#E4D2A3; --panel:#EFE2BF; --panel2:#F6ECD3; --paper:#FBF7EC; --paper-ink:#1C2236;
  --ink:#1C2236; --muted:#5E5743; --line:#BCA673; --accent:#B23A35; --mark:#8A5A00; --ok:#2E6B3F;
  --land:#EADBB2; --plateau:#D9C48F; --sea:#A9C3C9; --river:#2F6F8F; --mount:#8C7A52;
  --shadow:0 10px 24px rgba(60,40,0,.18);
  --serif:"Gowun Batang","Nanum Myeongjo","AppleMyungjo","Batang",Georgia,serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --panel:#151D31; --panel2:#1B2440; --paper:#ECEFF5; --paper-ink:#141A2B;
  --ink:#E8ECF4; --muted:#A2AAC0; --line:#2E3958; --accent:#E06A62; --mark:#F2B544; --ok:#6FCF8E;
  --land:#1A2338; --plateau:#232E4A; --sea:#10283A; --river:#5FB3D6; --mount:#5A6788; --shadow:0 12px 28px rgba(0,0,0,.45);}}
:root[data-theme="dark"]{
  --bg:#0E1424; --panel:#151D31; --panel2:#1B2440; --paper:#ECEFF5; --paper-ink:#141A2B;
  --ink:#E8ECF4; --muted:#A2AAC0; --line:#2E3958; --accent:#E06A62; --mark:#F2B544; --ok:#6FCF8E;
  --land:#1A2338; --plateau:#232E4A; --sea:#10283A; --river:#5FB3D6; --mount:#5A6788; --shadow:0 12px 28px rgba(0,0,0,.45);}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:16px 18px 40px}
header.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px}
.case{font-family:var(--serif);font-weight:700;font-size:clamp(26px,3.8vw,40px);line-height:1.1;margin:0}
.case small{display:block;font-size:.42em;font-weight:400;color:var(--muted);margin-bottom:4px}
.status{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:15px}
.days{display:flex;align-items:center;gap:8px}
.days b{font-family:var(--serif);font-size:24px}
.cal{display:flex;gap:3px}
.cal i{width:9px;height:18px;border-radius:2px;background:var(--ink);opacity:.85}
.cal i.used{opacity:.15}
.met{display:flex;gap:4px}
.met span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--line);font-family:var(--serif);font-weight:700;font-size:14px;color:var(--muted)}
.met span.on{border-style:solid;border-color:var(--ink);background:var(--ink);color:var(--bg)}
.meter{display:flex;align-items:center;gap:8px}
.meter .bar{width:110px;height:10px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent);transition:width .6s}
.btn{padding:9px 16px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:500}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.game{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,1fr);gap:18px;margin-top:16px;align-items:start}
@media (max-width:900px){.game{grid-template-columns:1fr}}
.mapbox{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:8px;position:sticky;top:8px}
@media (max-width:900px){.mapbox{position:static}}
svg.map{display:block;width:100%;height:auto}
.map .land{fill:var(--land)} .map .plateau{fill:var(--plateau)} .map .sea{fill:var(--sea)}
.map .river{fill:none;stroke:var(--river);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.map .river2{fill:none;stroke:var(--river);stroke-width:2;opacity:.5}
.map .mtn{fill:var(--mount);opacity:.55}
.map .zone{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 4;opacity:.7}
.map .lbl{font-family:var(--serif);font-size:24px;fill:var(--muted);font-weight:700}
.map .lbl.sm{font-size:17px;font-weight:400;font-family:var(--sans)}
.map .road{stroke:var(--ink);stroke-width:2;stroke-dasharray:3 6;opacity:.35;fill:none}
.map .road.live{opacity:.9;stroke-width:3}
.map .node{cursor:default}
.map .node circle.dot{fill:var(--paper);stroke:var(--ink);stroke-width:3}
.map .node.visited circle.dot{fill:var(--ink)}
.map .node.reach{cursor:pointer}
.map .node.reach circle.ring{fill:none;stroke:var(--mark);stroke-width:3;animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.map .node text{font-size:21px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:5px;stroke-linejoin:round}
.map .node .cost{font-size:18px;fill:var(--mark);font-weight:700}
.map .node.fresh > *{animation:appear .8s ease-out}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.3}}
@keyframes appear{0%{opacity:0}100%{opacity:1}}
.map #token circle{fill:var(--accent)}
.map .lbl.riv{fill:var(--river);font-style:italic}
.map .lbl.big{font-size:40px;letter-spacing:.3em;opacity:.8}
.map .lbl.sea{fill:color-mix(in srgb,var(--river) 70%,var(--ink));font-style:italic;font-size:26px}
.map .lbl.terr{font-style:italic;opacity:.8}
.map .lbl.area{fill:var(--accent);font-family:var(--sans);font-weight:700;font-size:20px}
.map .areabox{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 5}
.map.far .node text,.map.far .lbl.inreg{display:none}
.map:not(.far) .areabox,.map:not(.far) .lbl.area{display:none}
.map .lbl.zl{fill:var(--accent)}
.map .lbl.city{font-family:var(--sans);font-weight:500}
.map circle.city{fill:var(--muted)}
.map .node.here circle.dot{stroke:var(--accent);stroke-width:4}
.zoombar{position:absolute;top:14px;right:14px;z-index:2;display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--panel2)}
.zoombar button{border:0;background:transparent;padding:6px 11px;font-size:13.5px}
.zoombar button+button{border-left:1.5px solid var(--ink)}
.zoombar button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.zoombar button:disabled{opacity:.4}

.mapnote{font-size:12.5px;color:var(--muted);margin:4px 6px 2px}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:18px}
.card h2{font-family:var(--serif);font-size:24px;margin:0 0 2px;line-height:1.3}
.card .where{font-size:14px;color:var(--muted)}
.card p{margin:10px 0}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.act{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:11px 14px;border-radius:9px;border:1.5px solid var(--ink);background:var(--panel2)}
.act:hover:not(:disabled){background:var(--ink);color:var(--bg)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act .c{font-size:13px;white-space:nowrap;color:var(--mark);font-weight:700}
.act:hover:not(:disabled) .c{color:var(--bg)}
.act small{display:block;font-size:13px;opacity:.75}
.sub{font-size:14px;font-weight:700;color:var(--muted);margin:14px 0 4px}
.dispatch{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:20px 22px;box-shadow:var(--shadow);font-family:var(--serif);font-size:17px;line-height:1.8}
.dispatch .flash{display:inline-block;background:#B23A35;color:#fff;font-family:var(--sans);font-weight:700;font-size:13px;padding:1px 9px;border-radius:3px;margin-bottom:8px}
.dispatch p{margin:0 0 10px}
.field{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.field input{padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel2)}
.npc{display:flex;gap:14px;align-items:center}
.face{flex:0 0 58px;height:58px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:26px}
.log{display:flex;flex-direction:column;gap:9px;margin-top:12px;max-height:46vh;overflow-y:auto;padding-right:4px}
.msg{padding:10px 13px;border-radius:10px;font-size:15.5px;white-space:pre-wrap;max-width:92%}
.msg.q{align-self:flex-end;background:var(--ink);color:var(--bg)}
.msg.a{align-self:flex-start;background:var(--paper);color:var(--paper-ink);font-family:var(--serif)}
.msg.cold{border:2px dashed #B23A35}
.msg .got{display:block;margin-top:6px;font-family:var(--sans);font-size:13px;color:#2E6B3F;font-weight:700}
.msg .lost{display:block;margin-top:6px;font-family:var(--sans);font-size:13px;color:#B23A35;font-weight:700}
.qs{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.qs button{text-align:left;padding:9px 12px;border-radius:8px;border:1.5px solid var(--ink);background:transparent;font-size:15px}
.qs button:hover:not(:disabled){background:var(--ink);color:var(--bg)}
.qs button:disabled{opacity:.4;cursor:not-allowed}
.qs button.used{text-decoration:line-through;opacity:.3}
.free{display:flex;gap:8px;margin-top:10px}
.free input{flex:1;min-width:0;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}
.note{font-size:13.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1}
dialog{border:0;border-radius:12px;padding:0;max-width:min(680px,94vw);width:100%;background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,14,25,.55)}
.dlg{padding:22px 24px}
.dlg h3{font-family:var(--serif);font-size:24px;margin:0 0 6px}
.dlg .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.event-ic{font-size:40px;line-height:1}
.coin{display:inline-block;animation:flip .25s linear infinite}
.coin.done{animation:none}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(.1)}100%{transform:scaleX(1)}}
.nb-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.nb-tabs button{padding:6px 12px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;font-size:14px}
.nb-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.clue{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:10px 12px;margin:8px 0;font-size:15px}
.clue b{font-size:12.5px;display:inline-block;padding:0 7px;border-radius:4px;background:#1C2236;color:#fff;margin-right:6px;font-weight:500}
.clue b.k-근거{background:#2E6B3F}.clue b.k-지형{background:#8A5A00}.clue b.k-주장{background:#B23A35}
.article{background:var(--paper);color:var(--paper-ink);padding:20px 22px;border-radius:4px;font-family:var(--serif);font-size:16.5px;line-height:1.85;box-shadow:var(--shadow)}
.article h4{margin:0 0 10px;font-size:20px}
.redact{background:#1C2236;color:transparent;border-radius:2px;user-select:none}
.restored{background:rgba(242,181,68,.28)}
.lineup{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.lineup button{text-align:left;padding:11px 14px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel2)}
.lineup button:hover:not(:disabled){border-color:var(--ink)}
.lineup button.x{text-decoration:line-through;opacity:.5}
.result{margin-top:12px;padding:12px 14px;border-radius:9px;border:1.5px solid var(--accent);background:var(--panel2)}
.ending{background:var(--paper);color:var(--paper-ink);padding:22px 24px;border-radius:4px;box-shadow:var(--shadow);position:relative;margin-top:14px}
.ending .tier{font-size:13.5px;color:#5a5a70;display:block;padding-right:120px}
.ending .big{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.35;margin:4px 0 10px}
.ending p{margin:0 0 8px}
.ending ul{margin:4px 0 8px;padding-left:20px}
.stamp{position:absolute;top:16px;right:16px;transform:rotate(-12deg);border:3px solid #B23A35;color:#B23A35;font-weight:700;padding:2px 10px;border-radius:6px;font-size:16px;background:rgba(255,255,255,.6)}
textarea.big{width:100%;min-height:200px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical}
.article.mine{border-left:5px solid #B23A35}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted);margin:6px 0 4px}
details.ref{margin-top:8px;border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel2)}
details.ref summary{cursor:pointer;font-weight:500}
.ending .grade{margin-top:10px;padding-top:8px;border-top:1px dashed #b8b8c8}
.h3{font-family:var(--serif);font-size:21px;margin:22px 0 4px}
.fine{font-size:12.5px;color:var(--muted);margin-top:22px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.travel{position:fixed;inset:0;z-index:40;background:#0b0f19;display:flex;flex-direction:column}
.travel[hidden]{display:none}
.travel canvas{flex:1;width:100%;height:100%;display:block}
.tcap{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none}
.tcap .r{font-family:var(--serif);font-weight:700;font-size:clamp(24px,4vw,40px)}
.tcap .d{font-size:16px;opacity:.9}
.tskip{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;padding:8px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.7);background:rgba(0,0,0,.35);color:#fff;font-size:14px}
.travel .fade{position:absolute;inset:0;background:#0b0f19;opacity:0;pointer-events:none;transition:opacity .45s}
canvas.banner{display:block;width:calc(100% + 36px);height:150px;margin:-18px -18px 14px;border-radius:12px 12px 0 0}
.crew{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.crew span{padding:2px 10px;border-radius:999px;border:1.5px solid var(--ink)}
.crew span.me{background:var(--ink);color:var(--bg)}
.grp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grp select,.grp input{padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel2);width:100%}
.grp .full{grid-column:1/-1}
.tt{width:100%;border-collapse:collapse;font-size:15px}
.tt th,.tt td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.tt th{color:var(--muted);font-weight:500;font-size:13px}
@media (prefers-reduced-motion:reduce){.map .x{}.map .node.reach circle.ring,.map .node.fresh{animation:none}}
.rolechip{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--tc);color:#fff;font-weight:700;font-size:14px}
.days .dd{margin-left:8px;font-size:13.5px;padding:2px 8px;border-radius:999px;border:1.5px solid var(--ink)}
.days .dd.late,.late{color:var(--accent);border-color:var(--accent);font-weight:700}
.evn b{font-family:var(--serif);font-size:20px}
.game.wide{grid-template-columns:1fr}
.game.wide .mapbox{display:none}
.draw{text-align:center;padding:18px 0 4px}
.drum{display:inline-block;min-width:240px;padding:18px 26px;border-radius:14px;border:3px dashed var(--line);font-family:var(--serif);font-weight:700;font-size:28px;margin-bottom:12px;background:var(--panel2)}
.drum.done{border-style:solid;border-color:var(--tc);color:var(--tc);animation:pop2 .5s ease-out}
@keyframes pop2{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:none}}
.rolepick{display:grid;gap:6px;text-align:left;margin-top:10px}
.mission{border-left:6px solid var(--tc);background:var(--panel2);padding:12px 14px;border-radius:6px;margin:10px 0}
.mission b{color:var(--tc);margin-right:6px}
ul.rules2{margin:4px 0 8px;padding-left:20px}ul.rules2 li{margin:4px 0}
em.own{font-style:normal;font-size:12px;background:var(--ok);color:var(--bg);padding:1px 7px;border-radius:999px;margin-left:6px}
.act.home{border-color:var(--accent)}
.datacard{background:var(--paper);color:var(--paper-ink);border:2px solid #1F6FA8;border-radius:8px;padding:12px 14px;margin:10px 0}
.datacard .dtag{display:inline-block;background:#1F6FA8;color:#fff;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:4px}
.datacard p{margin:8px 0 4px;font-family:var(--serif);font-size:16px;line-height:1.7}
.datacard .src{font-size:12.5px;color:#5a5a70}
.dpick{margin-top:10px;font-size:14.5px}.dpick p{margin:0 0 6px;font-family:var(--sans);font-size:14.5px}
.dbtns{display:flex;flex-wrap:wrap;gap:6px}
.dbtns button{padding:5px 12px;border-radius:999px;border:2px solid var(--tc);background:#fff;color:var(--tc);font-weight:700;font-size:13.5px}
.dbtns button:hover{background:var(--tc);color:#fff}
.dpick.done{padding:8px 10px;border-radius:6px;font-family:var(--sans)}
.dpick.ok{background:rgba(46,107,63,.14);color:#2E6B3F}.dpick.no{background:rgba(178,58,53,.12);color:#8E2C28}
.tip{background:var(--panel2);border-left:4px solid var(--mark);padding:8px 12px;border-radius:6px;font-size:14.5px;margin-top:10px}
.lab{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-family:var(--sans);font-size:14px}
.lab button{padding:5px 14px;border-radius:999px;border:1.5px solid #1C2236;background:#fff;color:#1C2236;font-weight:700}
.lab button:hover{background:#1C2236;color:#fff}
.lab.done{display:block;padding:6px 10px;border-radius:6px}
.lab.ok{background:rgba(46,107,63,.14);color:#2E6B3F}.lab.no{background:rgba(178,58,53,.12);color:#8E2C28}
.clue b.k-현장{background:#8A5A00}
.kwpaper{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:14px 16px;box-shadow:var(--shadow)}
.kwpaper h4{margin:0 0 8px;font-family:var(--serif);font-size:18px}
.kwrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0;border-top:1px dashed #c8c8d4}
.kwrow .n{font-family:var(--serif);font-weight:700;width:18px;color:#6b6b80}
.kw{background:rgba(242,181,68,.35);padding:2px 9px;border-radius:4px;font-size:14.5px}
.kwx{background:#1C2236;color:#9aa2b4;padding:2px 12px;border-radius:3px;font-size:13px}
.example{margin:14px 0 6px;padding:12px 14px;border:1.5px dashed var(--line);border-radius:8px;font-size:15px;background:var(--panel2)}
.example u{text-decoration-color:var(--mark);text-decoration-thickness:2px}
.frame{font-family:var(--serif);font-size:18px;line-height:2.4;background:var(--paper);color:var(--paper-ink);padding:10px 16px;border-radius:6px}
.frame input{font:inherit;font-family:var(--sans);font-size:16px;border:0;border-bottom:2px solid #1C2236;background:transparent;color:#1C2236;padding:2px 6px;width:min(420px,70%)}
.evpicks.tall{max-height:none}
.evpick.big{text-align:left;border-radius:8px;font-size:14px;line-height:1.5;padding:8px 12px;width:100%}
.frames{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}

      drawTravel(ctx,rect.width,rect.height,sc,pos,{sp,time:el/1000,letterbox:Math.min(1,u*6,(1-u)*6+.0)});
      if(u>=1){setTimeout(finish,350);return;}requestAnimationFrame(frame);}
    requestAnimationFrame(frame);
  });
}

<p>그런데 어느 밤, 사무실의 사물인터넷(IoT) 기기를 노린 해킹 공격이 일어났다. 모든 대표단의 정리문이 대부분 지워지고 <b>한 문장씩만</b> 남았다.</p>
<p>회담까지 남은 시간은 보름(15일). 각 대표단은 비밀리에 <b>조사 탐정</b>을 현지로 보냈다. 너희가 바로 그 탐정이다. 증거를 모아 정리문을 되살리고, 기한 안에 회담장으로 돌아와라.</p>`;

  } else if(!S.role){
    body=`<div class="draw"><div class="drum" id="drum">?</div><p><b>${S.cls}반 ${S.grp}모둠</b>, 버튼을 눌러 우리 모둠이 맡을 대표단을 뽑으세요!</p><button class="btn big" data-act="drawrole" id="drawbtn">대표단 뽑기</button><p class="note">같은 반의 다섯 모둠은 서로 다른 대표단을 맡습니다.</p></div>`;

  }

function rollDrum(final,cb){
  const el=$('#drum');if(!el){cb&&cb();return;}let n=0;const names=ROLE_KEYS.map(k=>TEAMS[k].name);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tick=()=>{if(!document.body.contains(el)){cb&&cb();return;}if(n>=(reduce?1:22)){el.textContent=TEAMS[final].name;el.classList.add('done');el.style.setProperty('--tc',TEAMS[final].color);setTimeout(()=>cb&&cb(),reduce?0:900);return;}el.textContent=names[n%5];n++;setTimeout(tick,45+n*n*0.35);};tick();
}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;}
function autoRole(cls,grp){const R=rng(hashStr(`summit-c${cls}-${todayStr()}`));const perm=ROLE_KEYS.slice();for(let i=perm.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]];}return perm[(grp-1)%5];}
function setRole(r,animate){
  if(S.role===r)return;
  const go=()=>{S.role=r;S.clues=[TEAMS[r].paper[0].c];S.unlocked.F=r!=='intl';save();render();};
  if(animate&&S.mode==='lobby')rollDrum(r,go);else go();
}

}

/* ---------- summit (self-running chatroom with AI moderator) ---------- */
const SUM={msgs:[],unsubM:null,unsubG:null,cls:null,sel:[],groups:[],aiBusy:false};
const OPEN_ROUND_TURNS=1, CONCLUDE_TURNS=3;
function subscribeSummit(cls){
  if(!dbNS||SUM.cls===cls)return;SUM.cls=cls;
  if(SUM.unsubM)SUM.unsubM();if(SUM.unsubG)SUM.unsubG();
  SUM.unsubM=dbNS.collection('msgs').where('cls','==',cls).orderBy('ts').limit(500).onSnapshot(q=>{SUM.msgs=q.docs.map(d=>d.data());onSummitUpdate();},()=>{});
  SUM.unsubG=dbNS.collection('groups').where('cls','==',cls).onSnapshot(q=>{SUM.groups=q.docs.map(d=>d.data()).filter(x=>x&&x.state&&x.state.role);onSummitUpdate();},()=>{});
}
function summitMsgs(){return dbNS?SUM.msgs:S.localSummit;}
/* derived state of the meeting from the message log */
function meeting(){
  const ms=summitMsgs();
  const entered=[...new Set(ms.filter(m=>m.kind==='sys'&&m.join).map(m=>m.team))];
  if(!dbNS){ROLE_KEYS.forEach(k=>{if(!entered.includes(k))entered.push(k);});}
  const late={};entered.forEach(k=>{const st=teamState(k);late[k]=st?isLate(st):false;});
  const turns={};ms.filter(m=>m.kind==='team').forEach(m=>{turns[m.team]=(turns[m.team]||0)+1;});
  const onTime=entered.filter(k=>!late[k]);
  const openingDone=onTime.every(k=>(turns[k]||0)>=OPEN_ROUND_TURNS);
  const concluded=ms.some(m=>m.kind==='ai'&&m.final);
  const allEnoughTurns=entered.length>=2&&entered.every(k=>(turns[k]||0)>=CONCLUDE_TURNS);
  let stage='opening';if(openingDone)stage='debate';if(openingDone&&entered.every(k=>(turns[k]||0)>=2))stage='proposal';if(concluded)stage='done';
  return {ms,entered,late,turns,onTime,openingDone,concluded,allEnoughTurns,stage};
}
const STAGE_LABEL={opening:'1라운드 · 기조 발언 (기한 안에 돌아온 대표단 먼저)',debate:'2라운드 · 반박과 토론',proposal:'3라운드 · 합의안 제안',done:'회담 종료 · 중재 결과 발표'};
function teamState(k){if(!dbNS)return k===S.role?S:null;const g=SUM.groups.find(x=>x.state.role===k);return g?g.state:(k===S.role?S:null);}
function msgHTML(m){if(m.kind==='ai')return `<div class="smsg ai ${m.final?'final':''}"><span class="who">AI 사회자${m.final?' · 최종 판단':''}</span><div>${esc(m.text)}</div></div>`;
  if(m.kind==='sys')return `<div class="smsg sys">${esc(m.text)}</div>`;
  const r=TEAMS[m.team]||{name:m.team,color:'#666'};const ev=(m.evid||[]).map(c=>CLUES[c]?`<span class="evchip">${CLUES[c].k}: ${esc(CLUES[c].t.slice(0,46))}…</span>`:'').join('');
  return `<div class="smsg team ${m.team===S.role?'mine':''}" style="--tc:${r.color}"><span class="who">${r.name}${m.first?' · 기조 발언':''}${m.by?` · ${esc(m.by)}`:''}</span><div>${esc(m.text)}</div>${ev?`<div class="evs">${ev}</div>`:`<div class="evs"><span class="evchip none">증거 제시 없음</span></div>`}</div>`;}
function vSummit(){
  const r=TEAMS[S.role],late=isLate();
  const chips=S.clues.filter(c=>CLUES[c]).map(c=>`<button class="evpick" data-ev2="${c}" aria-pressed="${SUM.sel.includes(c)}" title="${esc(CLUES[c].t)}">${S.lab[c]?`<span class="kchip k9-${S.lab[c]}">${KINDS.find(x=>x[0]===S.lab[c])[1]}</span> `:''}${CLUES[c].who==='T'?(DATA[c]?'공식 자료':'현장'):NPC[CLUES[c].who].short}: ${esc(CLUES[c].t.slice(0,28))}…</button>`).join('');
  const localCtl=!dbNS?`<div class="row" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px"><label class="note">발언 대표단 <select id="spk">${ROLE_KEYS.map(k=>`<option value="${k}" ${k===S.role?'selected':''}>${TEAMS[k].name}</option>`).join('')}</select></label></div><p class="note">이 기기는 다른 모둠과 연결되지 않아 교실 화면 한 대로 회담을 진행합니다. 발언하는 대표단을 골라 입력하세요.</p>`:'';
  return `<div class="summit"><div class="card"><div class="shead"><h2>얄룽창포강 협상 회담장</h2><span class="phase" id="phase"></span></div>
  <div class="who-in" id="whoin"></div>

const _playGraphic=playTravel;
playTravel=function(m){
  if(!m||m.from===m.to)return Promise.resolve();
  const md=MEDIA[m.to];if(!md)return _playGraphic(m);
  const ov=$('#travel'),cv=$('#tcv'),docEl=$('#tdoc'),img=$('#timg'),vid=$('#tvid'),fade=$('#tfade');
  $('#tr').textContent=`${placeName(m.from)} → ${placeName(m.to)}`;
  $('#td').textContent=m.to==='office'?'모은 증거를 들고 회담장으로':(m.days===0?'운 좋게 하루도 걸리지 않은 길':`${m.days}일 걸린 길`)+(m.w?' · '+EVENTS[m.w].t:'');
  $('#tcredit').textContent='자료 화면'+(md.credit?' · '+md.credit:'');
  cv.hidden=true;docEl.hidden=false;img.hidden=md.type!=='image';vid.hidden=md.type!=='video';
  const dur=md.type==='video'?7000:6000;
  if(md.type==='image'){img.src='/_blob/'+md.id;img.style.animation='none';void img.offsetWidth;img.style.animation=`kb ${dur}ms ease-in-out forwards`;}
  else{vid.src='/_blob/'+md.id;vid.currentTime=0;vid.play().catch(()=>{});}
  $('.tcap').style.opacity=1;ov.hidden=false;travelling=true;
  fade.style.transition='none';fade.style.opacity=1;requestAnimationFrame(()=>{fade.style.transition='opacity .6s';fade.style.opacity=0;});
  return new Promise(res=>{let done=false;const finish=()=>{if(done)return;done=true;fade.style.opacity=1;setTimeout(()=>{ov.hidden=true;cv.hidden=false;docEl.hidden=true;try{vid.pause();}catch(e){}travelling=false;res();},620);};
    $('#tskip').onclick=finish;setTimeout(finish,dur);});
};

async function joinGroup(saved){
  const cls=saved?saved.cls:+$('#gcls').value,grp=saved?saved.grp:+$('#ggrp').value,name=saved?saved.name:($('#gname').value||'').trim();
  const team=saved?null:($('#team').value||'').trim();
  if(!saved&&!name){toast('내 이름을 먼저 적어 주세요.');$('#gname').focus();return;}
  G.name=name;
  if(!dbNS){S.cls=cls;S.grp=grp;if(team)S.team=team;save();render();return;}
  const slug=`c${cls}-g${grp}`;
  try{G.ref=dbNS.doc('groups/'+slug);G.cls=cls;G.grp=grp;
    const snap=await G.ref.get();
    if(snap.exists&&snap.data().state){adopt(snap.data(),true);}
    else{S=fresh();S.cls=cls;S.grp=grp;S.team=team||`${cls}반 ${grp}모둠`;await doPush();}
  }catch(err){G.ref=null;S.cls=cls;S.grp=grp;if(team)S.team=team;save();toast('다른 기기와 연결하지 못했어요. 이 기기 혼자 진행합니다.');render();return;}
  G.on=true;try{localStorage.setItem(GKEY,JSON.stringify({cls,grp,name}));}catch(e){}
  if(G.unsub)G.unsub();G.unsub=G.ref.onSnapshot(sn=>{if(sn.exists)adopt(sn.data());},()=>{});
  if(roomNS){try{G.room=await roomNS.join(slug);await G.room.presence({name});G.room.onPeers(ch=>{G.peers=ch.peers.filter(p=>p.kind==='viewer');renderStatus();},()=>{});}catch(e){G.room=null;}}

}

function adopt(d,force){
  if(!d||!d.state)return;
  if(!force){if(d.by===G.me)return;if(d.v<S.v)return;if(d.v===S.v&&d.ts<=G.lastTs)return;}
  const prevMove=S.lastMove&&S.lastMove.id,prevMode=S.mode;
  const localPaper=S.paper?Object.assign({},S.paper):null;
  G.applying=true;S=Object.assign(fresh(),d.state);S.v=d.v;G.applying=false;sanitize();
  if(localPaper&&S.paper){['demand','reason'].forEach(f=>{if(!(S.paper[f]||'').trim()&&(localPaper[f]||'').trim())S.paper[f]=localPaper[f];});}
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}

  if(!force&&S.lastMove&&S.lastMove.id!==prevMove&&!travelling){renderStatus();playTravel(S.lastMove).then(render);}
  else if(!travelling&&!(typing&&prevMode===S.mode))render();
  else renderStatus();
}

  const qnote=pending?'<p class="tip">위 대답이 우리에게 어떤 자료인지 먼저 골라야 다음 질문을 할 수 있다.</p>':(qleft===0?'<p class="tip">이 사람에게 물을 것은 다 물었다.</p>':'');

  const free=aiState==='on'?`<details class="ref" style="margin-top:10px"><summary>더 궁금한 것을 직접 물어보기 (선택)</summary><form class="free" id="freef" style="margin-top:8px"><input id="freein" maxlength="160" placeholder="직접 질문해 보세요" ${busy||freeUsed>=3?'disabled':''}><button class="btn small" ${busy||freeUsed>=3?'disabled':''}>묻기</button></form><p class="note">남은 ${3-freeUsed}번. AI가 기사 내용 안에서 답하며, 수첩에는 기록되지 않습니다.</p></details>`:'';
  return `<div class="card"><div class="npc"><div class="face">${k}</div><div><h2>${p.name}</h2><span class="where">${k==='F'&&S.loc!=='kath'?'화상 회의':NODES[S.loc].full}</span></div></div>
  <div class="tip">대답을 듣고, 그 말이 우리 대표단에게 <b>우리 편 근거</b>인지, <b>상대를 반박할 근거</b>인지, <b>상대편 근거</b>인지 골라라.</div>
  <div class="log" aria-live="polite"><div class="msg a" style="font-family:var(--sans);background:transparent;color:var(--muted);padding:0">${esc(p.hello)}</div>${log}</div>
  <p class="sub">질문 고르기 (남은 질문 ${qleft}개)</p>${qnote}<div class="qs">${qs}</div>${free}
  <div class="acts" style="margin-top:14px"><button class="act" data-act="endtalk"><span>대화 마치기</span><span class="c">돌아가기</span></button></div></div>`;
}
function ask(i){
  const t=S.talk,k=t.who,q=NPC[k].qs[i];if((S.asked[k]||[]).includes(i))return;
  (S.asked[k]=S.asked[k]||[]).push(i);t.n++;
  t.log.push({r:'q',t:q.q});addClue(q.clue);t.log.push({r:'a',t:q.a,cid:q.clue});
  if(q.unlock&&!S.unlocked[q.unlock]){S.unlocked[q.unlock]=true;S.fresh=q.unlock;setTimeout(()=>toast('지도에 새 장소가 나타났다: 지질 조사 캠프'),400);}
  save();render();
}
/* talking and looking around take no time; only moving does */
function startTalk(k){busy=false;S.talk={who:k,n:0,log:[]};S.mode='talk';save();render();}
function observe(n){if(S.obs[n])return;const o=NODES[n].obs;S.obs[n]=true;if(!o.only)addClue(o.clue);const did=DATA_AT[n];if(did)addClue(did);save();render();showObs(n);}
function showObs(n){const o=NODES[n].obs,did=DATA_AT[n];const items=[];if(!o.only)items.push(o.clue);if(did)items.push(did);
  const all=items.every(c=>S.lab[c]);
  $('#dlgbody').dataset.kind='obs';$('#dlgbody').dataset.node=n;
  $('#dlgbody').innerHTML=`<h3>${o.t}</h3>${items.map(c=>DATA[c]?`<div class="datacard"><span class="dtag">공식 자료 · ${esc(DATA[c].title)}</span><p>${esc(DATA[c].t)}</p><span class="src">출처: ${esc(DATA[c].src)}</span>${labelBox(c)}</div>`:`<div class="clue"><b class="k-현장">현장 기록</b>${esc(CLUES[c].t)}${labelBox(c)}</div>`).join('')}
  <div class="row"><button class="btn" data-close ${all?'':'disabled'}>수첩에 넣기</button>${all?'':'<span class="note">자료를 분류하면 수첩에 넣을 수 있다.</span>'}</div>`;
  if(!$('#dlg').open)$('#dlg').showModal();}
function notebook(tab){
  tab=tab||'people';const m=met();let body='';
  if(tab==='people')body=m.size?'ABCDEFG'.split('').filter(k=>m.has(k)).map(k=>`<p class="sub">${NPC[k].name}</p>`+S.clues.filter(c=>CLUES[c]&&CLUES[c].who===k).map(c=>`<div class="clue">${esc(CLUES[c].t)}${labelBox(c)}</div>`).join('')).join(''):'<p class="note">아직 만난 관계자가 없다.</p>';
  if(tab==='land')body=S.clues.filter(c=>CLUES[c]&&CLUES[c].who==='T').map(c=>DATA[c]?`<div class="datacard"><span class="dtag">공식 자료 · ${esc(DATA[c].title)}</span><p>${esc(DATA[c].t)}</p><span class="src">출처: ${esc(DATA[c].src)}</span>${labelBox(c)}</div>`:`<div class="clue"><b class="k-현장">현장</b>${esc(CLUES[c].t)}${labelBox(c)}</div>`).join('')||'<p class="note">아직 현장 기록이 없다.</p>';
  if(tab==='paper')body=paperHTML()+'<p class="note">관련 증거를 찾으면 지워진 부분의 열쇠말이 되살아난다.</p>';
  $('#dlgbody').dataset.kind='nb';$('#dlgbody').dataset.tab=tab;
  $('#dlgbody').innerHTML=`<h3>수사 수첩</h3><div class="nb-tabs">${[['people','관계자의 말'],['land','현장 기록 · 공식 자료'],['paper','우리 정리문']].map(([id,l])=>`<button data-nb="${id}" aria-pressed="${tab===id}">${l}</button>`).join('')}</div><div style="max-height:60vh;overflow-y:auto">${body}</div><div class="row"><button class="btn" data-close>닫기</button></div>`;
  if(!$('#dlg').open)$('#dlg').showModal();
}
/* paper: evidence grouped by the students' own sorting */
const _vPaper9=vPaper;
vPaper=function(){
  const html=_vPaper9();const P=S.paper;
  const order=['우리편','반박','상대편',undefined];
  const sorted=S.clues.filter(c=>CLUES[c]).slice().sort((a,b)=>order.indexOf(S.lab[a])-order.indexOf(S.lab[b]));
  const pick=sorted.map(c=>{const C=CLUES[c];const on=(P.evid||[]).includes(c);const lab=S.lab[c]?KINDS.find(x=>x[0]===S.lab[c])[1]:'분류 안 함';return `<button class="evpick big" data-pev="${c}" aria-pressed="${on}"><span class="kchip k9-${S.lab[c]||'none'}">${lab}</span> <b>${C.who==='T'?(DATA[c]?'공식 자료':'현장'):NPC[C.who].short}</b> ${esc(C.t)}</button>`;}).join('');
  return html.replace(/<div class="evpicks tall">[\s\S]*?<\/div>\n  <div class="row"/,`<div class="evpicks tall">${pick||'<span class="note">모은 자료가 없다.</span>'}</div>\n  <div class="row"`)
    .replace(/<p class="sub">근거로 쓸 수 있는 것<\/p><ul class="rules2 note">[\s\S]*?<\/ul>/,'<p class="sub">근거 고르는 법</p><ul class="rules2 note"><li><b>우리 편 근거</b>로 요구를 뒷받침한다.</li><li><b>상대를 반박할 근거</b>는 회담에서 상대의 주장에 맞설 때 쓴다.</li><li><b>상대편 근거</b>는 상대가 무엇을 내세울지 미리 알려 준다.</li></ul>');
};
/* sanitize old labels */
const _san=sanitize;sanitize=function(){_san();try{Object.keys(S.lab||{}).forEach(c=>{if(!['우리편','반박','상대편'].includes(S.lab[c])||!CLUES[c])delete S.lab[c];});S.clues=(S.clues||[]).filter(c=>CLUES[c]);}catch(e){}};
sanitize();

/* ---------- animated background: drifting contour lines and a flowing river ---------- */
(function(){
  const cv=document.createElement('canvas');cv.id='bgfx';cv.setAttribute('aria-hidden','true');document.body.prepend(cv);
  const ctx=cv.getContext('2d');let w=0,h=0,last=0,t=0;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){const d=Math.min(1.5,window.devicePixelRatio||1);w=innerWidth;h=innerHeight;cv.width=w*d;cv.height=h*d;ctx.setTransform(d,0,0,d,0,0);}
  function col(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#888';}
  function draw(){
    ctx.clearRect(0,0,w,h);const line=col('--line'),river=col('--river'),team=col('--team')||col('--mark');
    const N=Math.ceil(h/46)+2;
    for(let i=0;i<N;i++){const base=i*46-20;ctx.beginPath();
      for(let x=-20;x<=w+20;x+=18){const y=base+14*Math.sin(x*.006+t*.25+i*.7)+8*Math.sin(x*.017-t*.18+i*1.3);x===-20?ctx.moveTo(x,y):ctx.lineTo(x,y);}
      ctx.strokeStyle=line;ctx.globalAlpha=i%5===0?.42:.22;ctx.lineWidth=i%5===0?1.4:1;ctx.stroke();}
    ctx.globalAlpha=.16;ctx.lineWidth=26;ctx.strokeStyle=river;ctx.lineCap='round';ctx.beginPath();
    for(let y=-30;y<=h+30;y+=16){const x=w*.82+60*Math.sin(y*.006+t*.12)+24*Math.sin(y*.02-t*.3);y===-30?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();
    ctx.globalAlpha=.5;ctx.lineWidth=2;ctx.setLineDash([6,22]);ctx.lineDashOffset=-t*40;ctx.strokeStyle=river;ctx.beginPath();
    for(let y=-30;y<=h+30;y+=16){const x=w*.82+60*Math.sin(y*.006+t*.12)+24*Math.sin(y*.02-t*.3);y===-30?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();ctx.setLineDash([]);
    ctx.globalAlpha=.10;ctx.fillStyle=team;for(let i=0;i<14;i++){const px=(i*197+t*12*(1+i%3))%(w+40)-20,py=(i*131+Math.sin(t*.4+i)*30)%h;ctx.beginPath();ctx.arc(px,py,2+i%4,0,7);ctx.fill();}
    ctx.globalAlpha=1;
  }
  function loop(ts){requestAnimationFrame(loop);if(document.hidden)return;if(ts-last<33)return;t+=(ts-last||33)/1000;last=ts;draw();}
  size();addEventListener('resize',()=>{size();draw();});
  if(reduce)draw();else requestAnimationFrame(loop);
})();

/* ---------- change class / group ---------- */
async function regroup(){
  const msg=S.started?'지금까지 이 기기에서 한 조사를 떠나 처음 화면으로 돌아갑니다. 모둠원 다른 기기의 기록은 그대로 남습니다.':'반과 모둠을 다시 고를 수 있습니다. 대표단은 새로 고른 반·모둠에 따라 다시 뽑습니다.';
  const ok=await askConfirm('반·모둠을 다시 고를까요?',msg,'다시 고르기');if(!ok)return;
  if(G.unsub)G.unsub();G.unsub=null;if(G.unsubLot)G.unsubLot();G.unsubLot=null;if(G.room){G.room.leave().catch(()=>{});G.room=null;}
  G.on=false;G.ref=null;G.peers=[];G.readonly=false;try{localStorage.removeItem(GKEY);}catch(e){}
  if(SUM.unsubM)SUM.unsubM();if(SUM.unsubG)SUM.unsubG();SUM.cls=null;SUM.msgs=[];SUM.groups=[];
  const keepName=S.team;S=fresh();S.team=keepName;try{localStorage.removeItem(KEY);}catch(e){}save();render();window.scrollTo({top:0});
}
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-node]');if(!t)return;
  if(t.dataset.cf){const r=cfResolve;cfResolve=null;$('#dlg').close();if(r)r(t.dataset.cf==='yes');return;}
  if(t.dataset.node){if(t.classList.contains('reach')&&!travelling)travel(t.dataset.node);return;}
  if(t.dataset.zoom){setZoom(t.dataset.zoom);return;}
  if(t.dataset.go){travel(t.dataset.go);return;}
  if(t.dataset.talk){startTalk(t.dataset.talk);return;}
  if(t.dataset.obs){observe(t.dataset.obs);return;}
  if(t.dataset.q!==undefined){ask(+t.dataset.q);return;}
  if(t.dataset.ev){resolveEvent(t.dataset.ev);return;}
  if(t.dataset.risk){const d=$('#dlg'),to=d.dataset.to,w=d.dataset.w,ok=d.dataset.result==='ok';d.close();spend(ok?0:2);arrive(to,ok?0:2,w,ok?'운이 좋았다! 하루도 쓰지 않고 도착했다.':'위험을 만나 이틀이 걸렸다.');return;}
  if(t.dataset.nb){notebook(t.dataset.nb);return;}
  if(t.dataset.close!==undefined){$('#dlg').close();return;}
  if(t.dataset.depart){S.started=true;spend(1);arrive(t.dataset.depart,1);return;}
  if(t.dataset.dlab){S.dlab[t.dataset.dlab]=t.dataset.v;save();const inNb=$('#dlgbody .nb-tabs');if(inNb)notebook('land');else showObs(DATA[t.dataset.dlab].node);return;}
  if(t.dataset.lab){S.lab[t.dataset.lab]=t.dataset.v;save();const db=$('#dlgbody');if($('#dlg').open&&db.dataset.kind==='nb')notebook(db.dataset.tab);else if($('#dlg').open&&db.dataset.kind==='obs')showObs(db.dataset.node);else render();return;}
  if(t.dataset.pev){const P=S.paper;P.evid=P.evid||[];const c=t.dataset.pev,i=P.evid.indexOf(c);if(i>=0)P.evid.splice(i,1);else{if(P.evid.length>=3){toast('근거는 세 개까지 고를 수 있어요.');return;}P.evid.push(c);}t.setAttribute('aria-pressed',P.evid.includes(c));save();return;}
  if(t.dataset.frame){const ta=$('#smsg');if(ta){ta.value=FRAMES[t.dataset.frame];ta.focus();const i=ta.value.indexOf('(');if(i>=0)ta.setSelectionRange(i+1,i+6);}return;}
  if(t.dataset.pickrole){setRole(t.dataset.pickrole,false);return;}
  if(t.dataset.ev2){const c=t.dataset.ev2,i=SUM.sel.indexOf(c);if(i>=0)SUM.sel.splice(i,1);else{if(SUM.sel.length>=3){toast('증거는 한 번에 3개까지 제시할 수 있어요.');return;}SUM.sel.push(c);}t.setAttribute('aria-pressed',SUM.sel.includes(c));return;}
  if(t.dataset.ttab){TT.tab=t.dataset.ttab;renderTeacher();return;}
  if(t.dataset.ai){const M=meeting();const last=[...M.ms].reverse().find(m=>m.kind==='team');aiSay(t.dataset.ai,t.dataset.ai==='reply'?last:undefined);return;}
  if(t.dataset.unmedia){removeMedia(t.dataset.unmedia);return;}
  if(t.dataset.savecr){saveCredit(t.dataset.savecr);return;}
  const a=t.dataset.act;
  if(a==='notebook')notebook();
  if(a==='regroup')regroup();
  if(a==='replayintro')openIntro();
  if(a==='teacher'){teacherOpen=!teacherOpen;if(teacherOpen&&!TT.unsubG)teacherSubscribe();render();}
  if(a==='joingroup')joinGroup();
  if(a==='drawrole'){if(S.role||!S.cls||!S.grp)return;t.disabled=true;setRole(autoRole(S.cls,S.grp),true);}
  if(a==='tobrief'){S.mode='brief';save();render();}
  if(a==='depart'){S.started=true;spend(1);arrive(TEAMS[S.role].home,1);}
  if(a==='endtalk'){S.mode='loc';S.talk=null;save();render();}
  if(a==='return')doReturn();
  if(a==='submitpaper'){const P=S.paper;const d=$('#pdemand'),r=$('#preason');if(d)P.demand=d.value;if(r)P.reason=r.value;P.submitted=true;save();toast('정리문을 확정했습니다. 협상 회담장으로 입장합니다.');enterSummit();}
  if(a==='editpaper'){S.paper.submitted=false;save();render();}
  if(a==='tosummit'){enterSummit();}
  if(a==='sendmsg')sendMsg();
  if(a==='draw')teacherDraw();
  if(a==='resetclass')resetClass();
  if(a==='clearsummit')clearSummit();
  if(a==='sysmsg'){const v=($('#sysin').value||'').trim();if(v&&dbNS){dbNS.collection('msgs').add({cls:TT.cls,kind:'sys',text:v,ts:Date.now()}).then(()=>{$('#sysin').value='';}).catch(()=>toast('보내지 못했어요.'));}}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.node){e.preventDefault();if(!travelling)travel(e.target.dataset.node);}});
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='team'){S.team=e.target.value;}
  if(id==='pclaim'||id==='pdemand'||id==='prebut'){S.paper=S.paper||{claim:'',demand:'',rebut:'',submitted:false};}
  if(id==='pdemand'){S.paper.demand=e.target.value;save();}if(id==='preason'){S.paper.reason=e.target.value;save();}if(id==='pdemand'){S.paper.demand=e.target.value;save();}if(id==='prebut'){S.paper.rebut=e.target.value;save();}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='tcls'){TT.cls=+t.value;teacherSubscribe();renderTeacher();}
  if(t.dataset&&t.dataset.upload&&t.files&&t.files[0])uploadMedia(t.dataset.upload,t.files[0]);});
document.addEventListener('submit',e=>{if(e.target.id==='freef'){e.preventDefault();const v=$('#freein').value.trim();if(v)freeAsk(v);}});
$('#dlg').addEventListener('cancel',e=>{if($('#dlgbody [data-ev]')||$('#coin'))e.preventDefault();});
$('#dlg').addEventListener('close',()=>{if(cfResolve){const r=cfResolve;cfResolve=null;r(false);}});
window.addEventListener('resize',()=>document.querySelectorAll('canvas.banner').forEach(drawBanner));
$('#reset').addEventListener('click',()=>{askConfirm('처음부터 다시 시작할까요?',G.on?'우리 모둠의 수사 기록이 모두 지워지고, 모둠원 모두의 화면이 처음으로 돌아갑니다.':'이 기기의 기록이 모두 지워집니다.','처음부터 다시').then(ok=>{if(!ok)return;const kv=S.v,c=S.cls,g=S.grp,tm=S.team;S=fresh();S.v=kv;if(G.on){S.cls=c;S.grp=g;S.team=tm;}try{localStorage.removeItem(KEY);}catch(e){}save();render();});});

async function initCaps(){
  render();
  try{if(!localStorage.getItem('geo-summit-intro')&&S.mode==='lobby'&&!S.role)openIntro();}catch(e){openIntro();}
  if(!window.claude||!window.claude.use){aiState='off';groupReady=true;render();return;}
  try{sampleFn=await window.claude.use('sample');}catch(e){sampleFn=null;}aiState=sampleFn?'on':'off';
  try{downloads=await window.claude.use('downloads');}catch(e){}
  try{dbNS=await window.claude.use('db');}catch(e){dbNS=null;}
  try{userNS=await window.claude.use('user');}catch(e){}
  try{roomNS=await window.claude.use('room');}catch(e){}
  try{assetsNS=await window.claude.use('assets');}catch(e){}
  if(userNS){try{G.teacher=await userNS.isOwner();}catch(e){}}
  if(dbNS){dbNS.doc('media/slots').onSnapshot(d=>{MEDIA=(d.exists&&d.data().slots)||{};if(teacherOpen&&TT.tab==='media')paintTeacherBody();},()=>{});}
  groupReady=true;render();
  try{const g=JSON.parse(localStorage.getItem(GKEY)||'null');if(g&&dbNS)joinGroup(g);}catch(e){}
  if(dbNS&&S.cls&&S.mode==='summit')subscribeSummit(S.cls);
}
initCaps();
